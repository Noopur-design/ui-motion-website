<!doctype html>
<!--
  Social preview card (1200×630). Rendered to public/og-image.png by
  `npm run og` while the dev server is running. Edit and re-run to update.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>OG card</title>
    <script type="module">
      import "/src/index.css";
    </script>
    <style>
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }
      body::after {
        opacity: 0.09;
      }
    </style>
  </head>
  <body>
    <div class="relative flex h-full w-full flex-col justify-between bg-paper p-16 text-ink">
      <div class="flex items-center justify-between">
        <span class="inline-flex items-center gap-3">
          <svg viewBox="0 0 40 28" class="h-7 w-auto overflow-visible">
            <circle cx="6" cy="20" r="4" fill="#141210" opacity=".2" />
            <circle cx="15" cy="13" r="5" fill="#141210" opacity=".45" />
            <circle cx="28" cy="10" r="8" fill="#141210" />
          </svg>
          <span class="display text-4xl tracking-[-0.045em]">inbetween</span>
        </span>
        <span class="label-mono text-ink-soft">( Motion design &amp; animation studio )</span>
      </div>

      <h1 class="display text-[150px] leading-[0.84] tracking-[-0.045em]">
        We Make<br />
        Ideas <span class="serif-accent text-[1.12em] text-orange">Move.</span>
      </h1>

      <div class="flex items-end justify-between">
        <p class="max-w-[30rem] text-2xl leading-snug text-ink-soft">
          Motion graphics, 2D animation, illustration and animated stories.
        </p>
        <span class="label-mono text-ink-soft">Showreel 2026 ▸</span>
      </div>

      <div class="absolute right-16 top-32 w-[380px] rotate-[3deg] overflow-hidden rounded-md shadow-[0_24px_60px_-30px_rgb(20_18_16/0.5)]">
        <svg viewBox="0 0 400 300" class="block w-full">
          <rect width="400" height="300" fill="#2340e6" />
          <line x1="40" y1="262" x2="360" y2="262" stroke="#f3eee4" stroke-width="2" />
          <g fill="none" stroke="#d9f24f" stroke-width="2">
            <circle cx="190" cy="64" r="24" opacity=".2" />
            <circle cx="190" cy="72" r="24" opacity=".28" />
            <circle cx="190" cy="95" r="24" opacity=".36" />
            <circle cx="190" cy="127" r="24" opacity=".44" />
            <circle cx="190" cy="165" r="24" opacity=".52" />
          </g>
          <ellipse cx="190" cy="248" rx="32" ry="16" fill="#d9f24f" />
          <ellipse cx="190" cy="264" rx="34" ry="5" fill="#141210" opacity=".35" />
        </svg>
      </div>
    </div>
  </body>
</html>
